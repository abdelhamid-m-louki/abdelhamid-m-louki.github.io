<div class="contenu-admin">
  <header class="topbar-admin">
    <div class="topbar-titre"><h1 class="topbar-h1">Compétences</h1><p class="topbar-sous-titre" id="topbar-date"></p></div>
    <div class="topbar-actions" id="topbar-actions"></div>
  </header>
  <main class="main-admin" id="contenu-principal" role="main">
    <div class="tableau-crud-wrapper">
      <table class="tableau-crud" aria-label="Liste des compétences">
        <thead><tr>
          <th>Nom</th><th>Catégorie</th><th>Niveau</th><th>Vedette</th><th>Ordre</th>
          <th class="col-actions"></th>
        </tr></thead>
        <tbody id="corps-liste" aria-live="polite"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Modale formulaire -->
<div class="modale-overlay" id="modale-form" role="dialog" aria-modal="true" aria-labelledby="modale-label">
  <div class="modale">
    <div class="modale-en-tete">
      <h2 class="modale-titre" id="modale-label">Nouvelle compétence</h2>
      <button class="btn-action-crud" id="btn-annuler" aria-label="Fermer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="modale-corps" style="display:flex;flex-direction:column;gap:var(--espace-5);">
      <input type="hidden" id="form-titre">
      <div class="groupe-champ">
        <label for="form-nom" class="etiquette etiquette-obligatoire">Nom de la compétence</label>
        <input type="text" id="form-nom" class="champ" placeholder="JavaScript, CSS, Figma…" required>
      </div>
      <div class="groupe-champ">
        <label for="form-categorie" class="etiquette">Catégorie</label>
        <input type="text" id="form-categorie" class="champ" placeholder="Frontend, Backend, Design…" list="list-cats">
        <datalist id="list-cats"><option value="Frontend"><option value="Backend"><option value="Design"><option value="DevOps"><option value="Marketing"><option value="Soft Skills"></datalist>
      </div>
      <div class="groupe-champ">
        <label for="form-niveau" class="etiquette">Niveau : <strong id="val-niveau">80</strong>%</label>
        <input type="range" id="form-niveau" class="niveau-slider" min="10" max="100" step="5" value="80">
      </div>
      <div class="grille-form-2">
        <div class="groupe-champ">
          <label for="form-ordre" class="etiquette">Ordre</label>
          <input type="number" id="form-ordre" class="champ champ-sm" value="1" min="1">
        </div>
        <div class="groupe-champ">
          <label class="etiquette">Vedette</label>
          <label class="interrupteur" style="margin-top:var(--espace-2)">
            <input type="checkbox" class="interrupteur-entree" id="form-vedette" checked>
            <div class="interrupteur-piste"><div class="interrupteur-curseur"></div></div>
          </label>
        </div>
      </div>
    </div>
    <div class="modale-pied">
      <button class="btn btn-fantome btn-sm" id="btn-annuler-pied" onclick="document.getElementById('modale-form').classList.remove('ouverte')">Annuler</button>
      <button class="btn btn-primaire btn-sm" id="btn-sauver">Enregistrer</button>
    </div>
  </div>
</div>
<div class="zone-toasts" id="zone-toasts" aria-live="assertive" role="status"></div><script type="module">
import stockage, { COLLECTIONS } from '/scripts/storage/storage-manager.js';
import { protegerPage, toast, confirmer, echapper } from '/scripts/admin/utils-admin.js';

const etat = { items: [], editId: null };

async function init() {
  const ok = await protegerPage(); if (!ok) return;
  const topbarActions = document.getElementById('topbar-actions');
  topbarActions.innerHTML = '<button class="btn btn-accent btn-sm" id="btn-ajouter"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Ajouter</button>';
  document.getElementById('btn-ajouter').addEventListener('click', () => ouvrirFormulaire(null));
  await charger();
}

async function charger() {
  const tbody = document.getElementById('corps-liste');
  try {
    const { donnees } = await stockage.obtenirTous(COLLECTIONS.COMPETENCES, { tri:'ordre', ordre:'asc' });
    etat.items = donnees || [];
    if (!donnees?.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:var(--espace-10);font-family:var(--police-mono);font-size:var(--taille-xs);color:var(--texte-tertiaire);">Aucune compétence. Cliquez sur Ajouter.</td></tr>';
      return;
    }
    tbody.innerHTML = donnees.map(c => `
      <tr>
        <td><strong>${echapper(c.nom||'')}</strong></td>
        <td style="font-family:var(--police-mono);font-size:var(--taille-xs);color:var(--texte-tertiaire);">${echapper(c.categorie||'—')}</td>
        <td>
          <div style="display:flex;align-items:center;gap:var(--espace-3);">
            <div style="flex:1;height:6px;background:var(--couleur-fond-alt);border:1px solid var(--couleur-encre-fantome);overflow:hidden;">
              <div style="height:100%;background:var(--couleur-encre);width:${c.niveau||0}%;"></div>
            </div>
            <span style="font-family:var(--police-mono);font-size:var(--taille-xs);color:var(--texte-tertiaire);min-width:32px;">${c.niveau||0}%</span>
          </div>
        </td>
        <td><span style="font-family:var(--police-mono);font-size:10px;color:${c.vedette?'var(--couleur-succes)':'var(--texte-fantome)'};">${c.vedette?'Oui':'Non'}</span></td>
        <td style="font-family:var(--police-mono);font-size:var(--taille-xs);color:var(--texte-tertiaire);">${c.ordre||1}</td>
        <td class="col-actions"><div class="actions-crud">
          <button class="btn-action-crud" data-id="${echapper(c.id)}" data-action="editer" aria-label="Modifier ${echapper(c.nom)}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          <button class="btn-action-crud danger" data-id="${echapper(c.id)}" data-nom="${echapper(c.nom)}" data-action="supprimer" aria-label="Supprimer ${echapper(c.nom)}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
        </div></td>
      </tr>`).join('');
    tbody.querySelectorAll('[data-action="editer"]').forEach(b => b.addEventListener('click', () => ouvrirFormulaire(b.dataset.id)));
    tbody.querySelectorAll('[data-action="supprimer"]').forEach(b => b.addEventListener('click', () => supprimer(b.dataset.id, b.dataset.nom)));
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="6" style="padding:var(--espace-5);color:var(--couleur-erreur);font-family:var(--police-mono);font-size:var(--taille-xs);">${echapper(err.message)}</td></tr>`;
  }
}

function ouvrirFormulaire(id) {
  etat.editId = id;
  const item = id ? etat.items.find(i => i.id === id) : null;
  const overlay = document.getElementById('modale-form');
  document.getElementById('form-titre').value     = item?.titre || item?.nom || '';
  document.getElementById('form-nom').value       = item?.nom || '';
  document.getElementById('form-categorie').value = item?.categorie || '';
  document.getElementById('form-niveau').value    = item?.niveau || 80;
  document.getElementById('val-niveau').textContent = item?.niveau || 80;
  document.getElementById('form-ordre').value     = item?.ordre || 1;
  document.getElementById('form-vedette').checked = item?.vedette !== false;
  document.getElementById('modale-label').textContent = id ? 'Modifier la compétence' : 'Nouvelle compétence';
  overlay.classList.add('ouverte');
  document.getElementById('form-nom').focus();
}

async function sauver() {
  const nom = document.getElementById('form-nom').value.trim();
  if (!nom) { toast('Le nom est obligatoire.', 'erreur'); return; }
  const donnees = {
    nom,
    categorie: document.getElementById('form-categorie').value.trim(),
    niveau:    parseInt(document.getElementById('form-niveau').value) || 80,
    ordre:     parseInt(document.getElementById('form-ordre').value) || 1,
    vedette:   document.getElementById('form-vedette').checked,
  };
  try {
    if (etat.editId) await stockage.metAJour(COLLECTIONS.COMPETENCES, etat.editId, donnees);
    else             await stockage.creer(COLLECTIONS.COMPETENCES, donnees);
    toast(etat.editId ? 'Compétence modifiée.' : 'Compétence ajoutée.', 'succes');
    fermerFormulaire();
    await charger();
  } catch (err) { toast(`Erreur : ${err.message}`, 'erreur'); }
}

async function supprimer(id, nom) {
  const ok = await confirmer({ titre:'Supprimer', message:`Supprimer « ${nom} » ?`, labelOk:'Supprimer', danger:true });
  if (!ok) return;
  try { await stockage.supprimer(COLLECTIONS.COMPETENCES, id); toast('Supprimé.', 'succes'); await charger(); }
  catch (err) { toast(`Erreur : ${err.message}`, 'erreur'); }
}

function fermerFormulaire() {
  document.getElementById('modale-form').classList.remove('ouverte');
  etat.editId = null;
}

document.addEventListener('DOMContentLoaded', () => {
  init();
  document.getElementById('form-niveau').addEventListener('input', e => { document.getElementById('val-niveau').textContent = e.target.value; });
  document.getElementById('btn-sauver').addEventListener('click', sauver);
  document.getElementById('btn-annuler').addEventListener('click', fermerFormulaire);
  document.getElementById('modale-form').addEventListener('click', e => { if (e.target === e.currentTarget) fermerFormulaire(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') fermerFormulaire(); });
});
</script></body></html>

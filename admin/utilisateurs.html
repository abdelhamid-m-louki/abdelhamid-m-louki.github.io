<div class="contenu-admin">
  <header class="topbar-admin">
    <div class="topbar-titre"><h1 class="topbar-h1">Utilisateurs</h1><p class="topbar-sous-titre" id="topbar-date"></p></div>
    <div class="topbar-actions">
      <button class="btn btn-accent btn-sm" id="btn-ajouter">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        Ajouter
      </button>
    </div>
  </header>
  <main class="main-admin" id="contenu-principal" role="main">

    <div class="tableau-crud-wrapper">
      <table class="tableau-crud" aria-label="Liste des utilisateurs">
        <thead><tr>
          <th class="col-image" aria-label="Avatar"></th>
          <th>Nom</th>
          <th>Email</th>
          <th>Rôle</th>
          <th>Statut</th>
          <th>Créé le</th>
          <th class="col-actions"></th>
        </tr></thead>
        <tbody id="corps-utilisateurs" aria-live="polite"></tbody>
      </table>
    </div>

  </main>
</div>

<!-- Modale formulaire utilisateur -->
<div class="modale-overlay" id="modale-form" role="dialog" aria-modal="true" aria-labelledby="modale-label">
  <div class="modale">
    <div class="modale-en-tete">
      <h2 class="modale-titre" id="modale-label">Nouvel utilisateur</h2>
      <button class="btn-action-crud" id="btn-fermer-modale" aria-label="Fermer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="modale-corps" style="display:flex;flex-direction:column;gap:var(--espace-5);">
      <input type="hidden" id="user-id">
      <div class="groupe-champ">
        <label for="user-nom" class="etiquette etiquette-obligatoire">Nom complet</label>
        <input type="text" id="user-nom" class="champ" placeholder="Prénom Nom" required>
      </div>
      <div class="groupe-champ">
        <label for="user-email" class="etiquette etiquette-obligatoire">Adresse email</label>
        <input type="email" id="user-email" class="champ" placeholder="admin@exemple.fr" required>
      </div>
      <div class="groupe-champ">
        <label for="user-role" class="etiquette">Rôle</label>
        <select id="user-role" class="selecteur">
          <option value="editeur">Éditeur</option>
          <option value="admin">Administrateur</option>
          <option value="lecteur">Lecteur</option>
        </select>
      </div>
      <div class="groupe-champ" id="groupe-mdp">
        <label for="user-mdp" class="etiquette">Mot de passe <span style="color:var(--texte-tertiaire);font-weight:400;">(laisser vide pour ne pas changer)</span></label>
        <input type="password" id="user-mdp" class="champ" placeholder="••••••••" minlength="8" autocomplete="new-password">
      </div>
      <div class="ligne-interrupteur">
        <span class="ligne-interrupteur-label">Compte actif</span>
        <label class="interrupteur"><input type="checkbox" class="interrupteur-entree" id="user-actif" checked><div class="interrupteur-piste"><div class="interrupteur-curseur"></div></div></label>
      </div>
    </div>
    <div class="modale-pied">
      <button class="btn btn-fantome btn-sm" id="btn-annuler">Annuler</button>
      <button class="btn btn-primaire btn-sm" id="btn-sauver">Enregistrer</button>
    </div>
  </div>
</div>
<div class="zone-toasts" id="zone-toasts" aria-live="assertive" role="status"></div><script type="module">
import stockage, { COLLECTIONS } from '/scripts/storage/storage-manager.js';
import { protegerPage, toast, confirmer, echapper, formaterDate } from '/scripts/admin/utils-admin.js';
import { ROLES } from '/scripts/auth/auth.js';

const etat = { items: [], editId: null };

async function init() {
  const ok = await protegerPage(ROLES.ADMIN); if (!ok) return;
  await charger();
  brancherEvenements();
}

async function charger() {
  const tbody = document.getElementById('corps-utilisateurs');
  try {
    const { donnees } = await stockage.obtenirTous(COLLECTIONS.UTILISATEURS, { tri:'cree_le', ordre:'desc' });
    etat.items = donnees || [];
    if (!donnees?.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:var(--espace-10);font-family:var(--police-mono);font-size:var(--taille-xs);color:var(--texte-tertiaire);">Aucun utilisateur.</td></tr>';
      return;
    }
    const labelRole = { admin:'Administrateur', editeur:'Éditeur', lecteur:'Lecteur' };
    const couleurRole = { admin:'var(--couleur-rouge)', editeur:'var(--couleur-accent-sombre)', lecteur:'var(--texte-tertiaire)' };
    tbody.innerHTML = donnees.map(u => `
      <tr>
        <td class="col-image">
          <div style="width:36px;height:36px;border-radius:50%;background:var(--couleur-encre);color:var(--couleur-fond);display:flex;align-items:center;justify-content:center;font-family:var(--police-display);font-weight:700;font-size:var(--taille-sm);">
            ${echapper((u.nom||u.email||'?')[0].toUpperCase())}
          </div>
        </td>
        <td><strong style="font-family:var(--police-corps);">${echapper(u.nom||'—')}</strong></td>
        <td style="font-family:var(--police-mono);font-size:var(--taille-xs);color:var(--texte-tertiaire);">${echapper(u.email||'')}</td>
        <td><span style="font-family:var(--police-mono);font-size:10px;font-weight:700;color:${couleurRole[u.role]||'var(--texte-secondaire)'};border:1px solid currentColor;padding:1px 6px;letter-spacing:0.08em;">${labelRole[u.role]||u.role||'—'}</span></td>
        <td><span style="font-family:var(--police-mono);font-size:10px;color:${u.actif?'var(--couleur-succes)':'var(--texte-fantome)'};">${u.actif?'Actif':'Inactif'}</span></td>
        <td style="font-family:var(--police-mono);font-size:var(--taille-xs);color:var(--texte-tertiaire);">${formaterDate(u.cree_le)}</td>
        <td class="col-actions"><div class="actions-crud">
          <button class="btn-action-crud" data-id="${echapper(u.id)}" data-action="editer" aria-label="Modifier ${echapper(u.nom||u.email)}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          <button class="btn-action-crud danger" data-id="${echapper(u.id)}" data-nom="${echapper(u.nom||u.email)}" data-action="supprimer" aria-label="Supprimer ${echapper(u.nom||u.email)}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
        </div></td>
      </tr>`).join('');
    tbody.querySelectorAll('[data-action="editer"]').forEach(b => b.addEventListener('click', () => ouvrirFormulaire(b.dataset.id)));
    tbody.querySelectorAll('[data-action="supprimer"]').forEach(b => b.addEventListener('click', () => supprimer(b.dataset.id, b.dataset.nom)));
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="7" style="padding:var(--espace-5);color:var(--couleur-erreur);font-family:var(--police-mono);font-size:var(--taille-xs);">${echapper(err.message)}</td></tr>`;
  }
}

function ouvrirFormulaire(id) {
  etat.editId = id;
  const u = id ? etat.items.find(i => i.id === id) : null;
  document.getElementById('user-id').value     = u?.id || '';
  document.getElementById('user-nom').value    = u?.nom || '';
  document.getElementById('user-email').value  = u?.email || '';
  document.getElementById('user-role').value   = u?.role || 'editeur';
  document.getElementById('user-mdp').value    = '';
  document.getElementById('user-actif').checked = u?.actif !== false;
  document.getElementById('modale-label').textContent = id ? "Modifier l'utilisateur" : "Nouvel utilisateur";
  document.getElementById('modale-form').classList.add('ouverte');
  document.getElementById('user-nom').focus();
}

async function sauver() {
  const nom   = document.getElementById('user-nom').value.trim();
  const email = document.getElementById('user-email').value.trim();
  if (!nom || !email) { toast('Nom et email sont obligatoires.', 'erreur'); return; }
  
  const donnees = {
    nom, email,
    role:  document.getElementById('user-role').value,
    actif: document.getElementById('user-actif').checked,
  };
  
  const mdp = document.getElementById('user-mdp').value;
  if (mdp) donnees.mot_de_passe_hash = mdp; // En production: hacher côté serveur
  
  try {
    if (etat.editId) await stockage.metAJour(COLLECTIONS.UTILISATEURS, etat.editId, donnees);
    else             await stockage.creer(COLLECTIONS.UTILISATEURS, donnees);
    toast(etat.editId ? 'Utilisateur modifié.' : 'Utilisateur créé.', 'succes');
    fermer(); await charger();
  } catch (err) { toast(`Erreur : ${err.message}`, 'erreur'); }
}

async function supprimer(id, nom) {
  const ok = await confirmer({ titre:"Supprimer l'utilisateur", message:`Supprimer « ${nom} » ?`, labelOk:'Supprimer', danger:true });
  if (!ok) return;
  try { await stockage.supprimer(COLLECTIONS.UTILISATEURS, id); toast('Supprimé.', 'succes'); await charger(); }
  catch (err) { toast(`Erreur : ${err.message}`, 'erreur'); }
}

function fermer() {
  document.getElementById('modale-form').classList.remove('ouverte');
  etat.editId = null;
}

function brancherEvenements() {
  document.getElementById('btn-ajouter').addEventListener('click', () => ouvrirFormulaire(null));
  document.getElementById('btn-sauver').addEventListener('click', sauver);
  document.getElementById('btn-annuler').addEventListener('click', fermer);
  document.getElementById('btn-fermer-modale').addEventListener('click', fermer);
  document.getElementById('modale-form').addEventListener('click', e => { if (e.target === e.currentTarget) fermer(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') fermer(); });
}

document.addEventListener('DOMContentLoaded', init);
</script></div></div></body></html>

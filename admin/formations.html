          <label for="form-diplome" class="etiquette">Diplôme</label>

        </div>

          <label for="form-fin" class="etiquette">Date de fin</label>

          <label for="form-lieu" class="etiquette">Lieu</label>
          <input type="text" id="form-lieu" class="champ" placeholder="Paris, France">
          
        </div>
        <div class="groupe-champ">
          <label for="form-desc" class="etiquette">Description</label>
          <textarea id="form-desc" class="zone-texte" rows="2" placeholder="Contenu de la formation…"></textarea>
        </div>
    </div>
    <div class="modale-pied">
      <button class="btn btn-fantome btn-sm" id="btn-annuler-pied" onclick="document.getElementById('modale-form').classList.remove('ouverte')">Annuler</button>
      <button class="btn btn-primaire btn-sm" id="btn-sauver">Enregistrer</button>
    </div>
  </div>
</div>
<div class="zone-toasts" id="zone-toasts" aria-live="assertive" role="status"></div><script type="module">
import stockage, { COLLECTIONS } from '/scripts/storage/storage-manager.js';
import { protegerPage, toast, confirmer, echapper, formaterDate, formaterDateInput } from '/scripts/admin/utils-admin.js';

const etat = { items: [], editId: null };
const COLL = COLLECTIONS.FORMATIONS;

async function init() {
  const ok = await protegerPage(); if (!ok) return;
  document.getElementById('topbar-actions').innerHTML = '<button class="btn btn-accent btn-sm" id="btn-ajouter"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Ajouter</button>';
  document.getElementById('btn-ajouter').addEventListener('click', () => ouvrirFormulaire(null));
  await charger();
}

async function charger() {
  const tbody = document.getElementById('corps-liste');
  try {
    const { donnees } = await stockage.obtenirTous(COLL, { tri:'cree_le', ordre:'desc' });
    etat.items = donnees || [];
    if (!donnees?.length) {
      tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:var(--espace-10);font-family:var(--police-mono);font-size:var(--taille-xs);color:var(--texte-tertiaire);">Aucun élément. Cliquez sur Ajouter.</td></tr>';
      return;
    }
    tbody.innerHTML = donnees.map(i => `
      <tr>
        <td style="font-size:var(--taille-xs);color:var(--texte-secondaire);">${echapper(String(i.titre||'—'))}</td>
        <td style="font-size:var(--taille-xs);color:var(--texte-secondaire);">${echapper(String(i.organisation||'—'))}</td>
        <td style="font-size:var(--taille-xs);color:var(--texte-secondaire);">${echapper(String(i.specialite||'—'))}</td>
        <td style="font-size:var(--taille-xs);color:var(--texte-secondaire);">${echapper(String(i.diplome||'—'))}</td>
        <td style="font-size:var(--taille-xs);color:var(--texte-secondaire);">${echapper(String(i.date_debut||'—'))}</td>
        <td class="col-actions"><div class="actions-crud">
          <button class="btn-action-crud" data-id="${echapper(i.id)}" data-action="editer" aria-label="Modifier"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          <button class="btn-action-crud danger" data-id="${echapper(i.id)}" data-action="supprimer" aria-label="Supprimer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
        </div></td>
      </tr>`).join('');
    tbody.querySelectorAll('[data-action="editer"]').forEach(b => b.addEventListener('click', () => ouvrirFormulaire(b.dataset.id)));
    tbody.querySelectorAll('[data-action="supprimer"]').forEach(b => b.addEventListener('click', () => supprimer(b.dataset.id)));
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="10" style="padding:var(--espace-5);color:var(--couleur-erreur);font-family:var(--police-mono);font-size:var(--taille-xs);">${echapper(err.message)}</td></tr>`;
  }
}

function ouvrirFormulaire(id) {
  etat.editId = id;
  const item = id ? etat.items.find(i => i.id === id) : null;
  document.getElementById("form-titre").value = item?.titre || '';
    document.getElementById("form-org").value = item?.organisation || '';
    document.getElementById("form-spec").value = item?.specialite || '';
    document.getElementById("form-diplome").value = item?.diplome || '';
    document.getElementById("form-mention").value = item?.mention || '';
    document.getElementById("form-debut").value = item?.date_debut || '';
    document.getElementById("form-fin").value = item?.date_fin || '';
    document.getElementById("form-lieu").value = item?.lieu || '';
    document.getElementById("form-desc").value = item?.description || '';
  document.getElementById('modale-label').textContent = id ? 'Modifier' : 'Ajouter';
  document.getElementById('modale-form').classList.add('ouverte');
  document.querySelector('#modale-form input, #modale-form textarea')?.focus();
}

async function sauver() {
  if (!document.getElementById("form-titre").value.trim() || !document.getElementById("form-org").value.trim()) { toast('Titre de la formation est obligatoire.', 'erreur'); return; }
  const donnees = { titre: form-titre.value.trim(),
      organisation: form-org.value.trim(),
      specialite: form-spec.value.trim(),
      diplome: form-diplome.value.trim(),
      mention: form-mention.value.trim(),
      date_debut: form-debut.value,
      date_fin: form-fin.value,
      lieu: form-lieu.value.trim(),
      description: form-desc.value.trim() };
  try {
    if (etat.editId) await stockage.metAJour(COLL, etat.editId, donnees);
    else             await stockage.creer(COLL, donnees);
    toast(etat.editId ? 'Modifié.' : 'Ajouté.', 'succes');
    fermerFormulaire(); await charger();
  } catch (err) { toast(`Erreur : ${err.message}`, 'erreur'); }
}

async function supprimer(id) {
  const ok = await confirmer({ titre:'Supprimer', message:'Confirmer la suppression ?', labelOk:'Supprimer', danger:true });
  if (!ok) return;
  try { await stockage.supprimer(COLL, id); toast('Supprimé.', 'succes'); await charger(); }
  catch (err) { toast(`Erreur : ${err.message}`, 'erreur'); }
}

function fermerFormulaire() {
  document.getElementById('modale-form').classList.remove('ouverte');
  etat.editId = null;
}

document.addEventListener('DOMContentLoaded', () => {
  init();
  document.getElementById('btn-sauver').addEventListener('click', sauver);
  document.getElementById('btn-annuler').addEventListener('click', fermerFormulaire);
  document.getElementById('modale-form').addEventListener('click', e => { if (e.target === e.currentTarget) fermerFormulaire(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') fermerFormulaire(); });
  
});
</script></body></html>
